[package]
name = "cloudpc-stream-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client streaming CloudPC untuk Android: pustaka JNI (decode MediaCodec, suara AAudio, input sentuh)"

[lib]
name = "cloudpc_stream"
crate-type = ["cdylib", "rlib"]

[dependencies]
cloudpc-stream-client = { path = "../client" }
cloudpc-stream-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = { version = "0.9", features = ["media", "audio", "api-level-26"] }
