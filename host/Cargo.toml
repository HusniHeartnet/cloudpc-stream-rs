[package]
name = "cloudpc-stream-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host streaming CloudPC (pengganti Sunshine): tangkap layar, encode, kirim lewat protokol GameStream"

[dependencies]
cloudpc-stream-proto = { path = "../proto" }
cloudpc-stream-common = { path = "../common" }
rand = "0.8"
rusty_enet = "0.4"
unsafe-libopus = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serialport = { version = "4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
libloading = "0.9"
moq-nvenc = "0.1"
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
