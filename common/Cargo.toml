[package]
name = "cloudpc-stream-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kripto, identitas, dan pembungkus pesan terenkripsi yang dipakai host dan client"

[dependencies]
cloudpc-stream-proto = { path = "../proto" }
aes = "0.8"
aes-gcm = "0.10"
rand = "0.8"
rcgen = "0.13"
rsa = { version = "0.9", features = ["sha2"] }
x509-cert = { version = "0.2", features = ["pem"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Media", "Win32_NetworkManagement_WiFi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
